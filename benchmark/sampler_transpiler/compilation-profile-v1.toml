"driver_source" = "include(\"/home/n/.local/state/kb-agents-worktrees/ReactiveKernels-sampling/benchmark/sampler_transpiler/hmc_eight_schools.jl\")\nusing Profile, Serialization\nconst PROFILE_DIR=\"/home/n/scratch/kb-agent-tmp/ReactiveKernels-sampling\"\nfunction profile_sampler_compile(program,projection)\n    call=TracedSlotCall(program.f,program.metadata)\n    driver=(state,seed,counts)->traced_owned_batch(call,projection,state,seed,counts,1000)\n    inputs=traced_slot_inputs(program.state)\n    Profile.init(n=10_000_000,delay=0.005)\n    Profile.clear()\n    compiled=measured(\"profiled_compile\") do\n        Profile.@profile Reactant.compile(driver,inputs;sync=true,donated_args=:none,serializable=true)\n    end\n    data,lidict=Profile.retrieve()\n    serialize(joinpath(PROFILE_DIR,\"sampler_compile.profile\"),(data,lidict))\n    open(joinpath(PROFILE_DIR,\"sampler_compile.flat.txt\"),\"w\") do io\n        Profile.print(io,data,lidict;format=:flat,sortedby=:count,mincount=20,C=true)\n    end\n    open(joinpath(PROFILE_DIR,\"sampler_compile.tree.txt\"),\"w\") do io\n        Profile.print(io,data,lidict;format=:tree,maxdepth=28,mincount=30,C=true)\n    end\n    println(\"profile_entries=\",length(data))\n    result=compiled(inputs...)\n    println(\"integration_steps=\",Int(result.counts[1]),\" mlir_bytes=\",sizeof(compiled.module_string))\n    Int(result.counts[1])==4000 || error(\"unexpected profile workload\")\n    check_traced_inputs_unchanged(inputs,program.state)\nend\nconst PROTOTYPE=build_fast_prototype(compiler_options=(peel_loops=true,))\nreset_native_slots!(PROTOTYPE.prepared)\nconst PROGRAM=compile_traced_slots(PROTOTYPE.prepared.program)\nconst PREFIX=Symbol(PROTOTYPE.prepared.program.contexts[2].prefix,:_owned)\nconst INDICES=Tuple(i for (i,pair) in enumerate(PROGRAM.ordered) if first(first(pair))===PREFIX)\nBase.invokelatest(profile_sampler_compile,PROGRAM,SlotStatic(INDICES))\n"

