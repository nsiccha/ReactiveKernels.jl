"driver_source" = "include(\"/home/n/.local/state/kb-agents-worktrees/ReactiveKernels-sampling/benchmark/sampler_transpiler/hmc_eight_schools.jl\")\n\nfunction dedup_metadata(program)\n    values=Any[]\n    indices=map(program.metadata.values) do value\n        index=findfirst(v->v===value,values)\n        if index===nothing\n            push!(values,value)\n            index=length(values)\n        end\n        index\n    end\n    function rewrite(x)\n        x isa Expr || return x\n        if x.head===:call && x.args[1]===:getfield &&\n            x.args[2]==:(metadata.values) && x.args[3] isa Int\n            return :(getfield(metadata.values,$(indices[x.args[3]])))\n        end\n        Expr(x.head,(rewrite(a) for a in x.args)...)\n    end\n    expression=rewrite(program.expression)\n    println(\"metadata_entries=\",length(indices),\" unique=\",length(values),\n        \" original_bytes=\",sizeof(program.metadata),\n        \" unique_bytes=\",sizeof(SlotStatic(Tuple(values))))\n    merge(program,(;f=Core.eval(@__MODULE__,expression),expression,\n        metadata=SlotStatic(Tuple(values))))\nend\n\nconst PROTOTYPE=build_fast_prototype(compiler_options=(peel_loops=true,))\nreset_native_slots!(PROTOTYPE.prepared)\nconst PROGRAM=dedup_metadata(compile_traced_slots(PROTOTYPE.prepared.program))\nconst PREFIX=Symbol(PROTOTYPE.prepared.program.contexts[2].prefix,:_owned)\nconst INDICES=Tuple(i for (i,pair) in enumerate(PROGRAM.ordered) if first(first(pair))===PREFIX)\nBase.invokelatest(run_traced_prepared,PROGRAM,PROTOTYPE.comparator,1000,PROTOTYPE.L,SlotStatic(INDICES))\n"

