"source" = "module BatchedRandomHMCAuthoring\n\nusing ReactiveKernels, Random, LinearAlgebra, LogExpFunctions\n\n# A mathematical source consumer of the generic compiler. The initial point\n# lies uniformly among the L+1 trajectory positions. Streaming weighted\n# selection retains a single candidate rather than storing every phasepoint.\n@kernel multinomial_hmc_state(init; n_steps=4, step_fwd=nothing, step_bwd=nothing, draws=zeros(n_steps)) = begin\n    fwd = deepcopy(init)\n    bwd = deepcopy(init)\n    step!(rng) = begin\n        init.mom = Random.randn!(rng, init.mom)\n        init.mom = sqrt(fwd.metric) * init.mom\n        fwd.pos .= init.pos\n        fwd.mom .= init.mom\n        bwd.pos .= init.pos\n        bwd.mom .= init.mom\n        initial_ham = init.ham\n        log_weight = zero(initial_ham)\n        n_fwd = Random.rand(rng, 0:n_steps)\n        draws = Random.randexp!(rng, draws)\n        for i in 1:n_steps\n            if i <= n_fwd\n                step_fwd(fwd)\n                raw_weight = initial_ham - fwd.ham\n                weight = (raw_weight - raw_weight == zero(raw_weight)) ? raw_weight : oftype(raw_weight, -Inf)\n                log_weight = logaddexp(log_weight, weight)\n                if -draws[i] < weight - log_weight\n                    init .= fwd\n                end\n            else\n                step_bwd(bwd)\n                raw_weight = initial_ham - bwd.ham\n                weight = (raw_weight - raw_weight == zero(raw_weight)) ? raw_weight : oftype(raw_weight, -Inf)\n                log_weight = logaddexp(log_weight, weight)\n                if -draws[i] < weight - log_weight\n                    init .= bwd\n                end\n            end\n        end\n    end\nend\n\nend\n"
"driver" = "include(\"/home/n/.local/state/kb-agents-worktrees/ReactiveKernels-sampling/benchmark/sampler_transpiler/multinomial_eight_schools.jl\")\ninclude(\"/home/n/scratch/kb-agent-tmp/ReactiveKernels-sampling/batched_random_hmc_kernel.jl\")\nconst MODE=only(ARGS)\nconst PROTOTYPE=build_multinomial_prototype(L=16,source=BatchedRandomHMCAuthoring.multinomial_hmc_state,compiler_options=(peel_loops=MODE==\"reactant\",))\nif MODE==\"reactant\"\n run_traced_comparison(PROTOTYPE;n=1000)\nelseif MODE==\"native\"\n run_prepared_comparison(PROTOTYPE.prepared,PROTOTYPE.comparator,16,1000)\nelse\n error(\"native or reactant\")\nend\n"
