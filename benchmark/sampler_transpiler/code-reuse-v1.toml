"note" = "Scratch experiment manually substitutes the first emitted function into later equal programs while retaining their state and metadata. The exact executed source is embedded below."
"order" = ["first_compile", "reuse_existing_code_1", "new_equal_code_1", "reuse_existing_code_2", "new_equal_code_2"]
"caller_inputs_preserved" = true
"source" = "include(\"/home/n/.local/state/kb-agents-worktrees/ReactiveKernels-sampling/benchmark/sampler_transpiler/hmc_eight_schools.jl\")\n\nfunction compile_reuse_case(program,projection,label)\n    call=TracedSlotCall(program.f,program.metadata)\n    driver=(state,seed,counts)->traced_owned_batch(call,projection,state,seed,counts,1000)\n    inputs=traced_slot_inputs(program.state)\n    compiled=measured(label) do\n        Reactant.compile(driver,inputs;sync=true,donated_args=:none,serializable=true)\n    end\n    result=compiled(inputs...)\n    Int(result.counts[1])==4000 || error(\"shortened workload\")\n    check_traced_inputs_unchanged(inputs,program.state)\n    println(label,\" integration_steps=\",Int(result.counts[1]),\n        \" mlir_bytes=\",sizeof(compiled.module_string))\nend\n\nconst PROTOTYPE=build_fast_prototype(compiler_options=(peel_loops=true,))\nreset_native_slots!(PROTOTYPE.prepared)\nconst PROGRAMS=ntuple(_->compile_traced_slots(PROTOTYPE.prepared.program),3)\nall(p->isequal(p.expression,PROGRAMS[1].expression),PROGRAMS) || error(\"emissions differ\")\nprintln(\"equal_emissions=true distinct_function_types=\",length(unique(typeof(p.f) for p in PROGRAMS)))\nconst PREFIX=Symbol(PROTOTYPE.prepared.program.contexts[2].prefix,:_owned)\nconst PROJECTION=SlotStatic(Tuple(i for (i,pair) in enumerate(PROGRAMS[1].ordered)\n    if first(first(pair))===PREFIX))\nfor (program,label) in (\n    (PROGRAMS[1],\"first_compile\"),\n    (merge(PROGRAMS[2],(;f=PROGRAMS[1].f)),\"reuse_existing_code_1\"),\n    (PROGRAMS[2],\"new_equal_code_1\"),\n    (merge(PROGRAMS[3],(;f=PROGRAMS[1].f)),\"reuse_existing_code_2\"),\n    (PROGRAMS[3],\"new_equal_code_2\"),\n)\n    Base.invokelatest(compile_reuse_case,program,PROJECTION,label)\nend\n"

