["single_work_race"]
"source" = "module SingleWorkRaceHMCAuthoring\nusing ReactiveKernels, Random, LinearAlgebra, LogExpFunctions\n\n@kernel multinomial_hmc_state(init; n_steps=4, step_f=nothing, stepsize=0.03) = begin\n    anchor = deepcopy(init)\n    work = deepcopy(init)\n    step!(rng) = begin\n        init.mom = Random.randn!(rng, init.mom)\n        init.mom = sqrt(anchor.metric) * init.mom\n        anchor.pos .= init.pos\n        anchor.mom .= init.mom\n        work.pos .= init.pos\n        work.mom .= init.mom\n        initial_ham = init.ham\n        best_key = log(Random.randexp(rng))\n        n_fwd = Random.rand(rng, 0:n_steps)\n        for i in 1:n_steps\n            if i == n_fwd + 1\n                work .= anchor\n            end\n            direction = i <= n_fwd ? stepsize : -stepsize\n            step_f(work; stepsize=direction)\n            raw_weight = initial_ham - work.ham\n            weight = (raw_weight - raw_weight == zero(raw_weight)) ? raw_weight : oftype(raw_weight, -Inf)\n            candidate_key = log(Random.randexp(rng)) - weight\n            if candidate_key < best_key\n                best_key = candidate_key\n                init .= work\n            end\n        end\n    end\nend\nend\n"
"driver" = "include(\"/home/n/.local/state/kb-agents-worktrees/ReactiveKernels-sampling/benchmark/sampler_transpiler/multinomial_eight_schools.jl\")\ninclude(\"/home/n/scratch/kb-agent-tmp/ReactiveKernels-sampling/single_work_race_hmc_kernel.jl\")\nconst MODE=ARGS[1]\nconst L=length(ARGS)>1 ? parse(Int,ARGS[2]) : 16\nconst PROTOTYPE=build_multinomial_prototype(;L,\n    source=SingleWorkRaceHMCAuthoring.multinomial_hmc_state,\n    source_controls=(step_f=F.leapfrog!,stepsize=0.03),\n    compiler_options=(peel_loops=MODE==\"reactant\",count_gradients=MODE==\"diagnostics\"))\nif MODE==\"reactant\"\n    run_traced_comparison(PROTOTYPE;n=1000)\nelseif MODE==\"native\"\n    run_prepared_comparison(PROTOTYPE.prepared,PROTOTYPE.comparator,L,1000)\nelseif MODE==\"diagnostics\"\n    check_multinomial_native(PROTOTYPE;n=1000)\nelse\n    error(\"native, reactant, or diagnostics\")\nend\n"
"interpretation" = "Native6.529us/transition,Reactant15.346us; no useful gain. Reactant IR42189B,3 while/0 if,3 currentness flags; compile42.648s. Uses minimum log(E)-weight with independent unit exponentials, including the initial point. This has the same multinomial selection law; it is not a trajectory/sequence matching device."

