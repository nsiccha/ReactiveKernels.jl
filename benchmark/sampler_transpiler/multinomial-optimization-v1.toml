"source" = "include(\"/home/n/.local/state/kb-agents-worktrees/ReactiveKernels-sampling/benchmark/sampler_transpiler/multinomial_eight_schools.jl\")\n\nstruct ExperimentalRNGCall{C}\n    call::C\n    algorithm::String\nend\nReactant.make_tracer(seen,previous::ExperimentalRNGCall,path,mode;kwargs...)=previous\nReactant.traced_type_inner(::Type{T},seen,mode::Reactant.TraceMode,\n    track_numbers::Type,ndevices,runtime) where {T<:ExperimentalRNGCall}=T\nfunction (adapter::ExperimentalRNGCall)(state,seed,counts)\n    result=adapter.call.f(state,Reactant.ReactantRNG(seed,adapter.algorithm),\n        counts,adapter.call.metadata)\n    (;state=result.state,seed=result.argument.seed,counts=result.counts)\nend\n\nfunction compare_rngs(program,projection,comparator;n=1000,L=16)\n    algorithms=(\"DEFAULT\",\"THREE_FRY\",\"PHILOX\")\n    executables=map(algorithms) do algorithm\n        call=ExperimentalRNGCall(TracedSlotCall(program.f,program.metadata),algorithm)\n        driver=(state,seed,counts)->traced_owned_batch(call,projection,state,seed,counts,n)\n        inputs=traced_slot_inputs(program.state)\n        compiled=measured(\"compile_\"*algorithm) do\n            Reactant.compile(driver,inputs;sync=true,donated_args=:none,serializable=true)\n        end\n        result=compiled(inputs...)\n        Int(result.counts[1])==L*n || error(\"shortened workload\")\n        check_traced_inputs_unchanged(inputs,program.state)\n        println(\"algorithm=\",algorithm,\" mlir_bytes=\",sizeof(compiled.module_string))\n        compiled\n    end\n    ahmc_chain(Xoshiro(91),comparator.hamiltonian,comparator.kernel,deepcopy(comparator.initial),2)\n    for sample in 1:7\n        # Rotate the backend order so one algorithm does not always run first.\n        for offset in 0:2\n            index=mod1(sample+offset,3)\n            inputs=traced_slot_inputs(program.state)\n            result=measured(algorithms[index]*\"_1000_transitions\") do\n                executables[index](inputs...)\n            end\n            Int(result.counts[1])==L*n || error(\"shortened workload\")\n            Array(result.seed)!=UInt64[91,77] || error(\"RNG did not advance\")\n            for value in result.values\n                value isa Reactant.AbstractConcreteArray || continue\n                all(isfinite,Array(value)) || error(\"nonfinite output\")\n            end\n            println(\"integration_steps=\",Int(result.counts[1]))\n        end\n        rng=Xoshiro(91);point=deepcopy(comparator.initial)\n        measured(\"ahmc_1000_transitions\") do\n            ahmc_chain(rng,comparator.hamiltonian,comparator.kernel,point,n)\n        end\n    end\nend\n\nconst PROTOTYPE=build_multinomial_prototype(L=16,compiler_options=(peel_loops=true,))\nreset_native_slots!(PROTOTYPE.prepared)\nconst PROGRAM=compile_traced_slots(PROTOTYPE.prepared.program)\nconst PREFIX=Symbol(PROTOTYPE.prepared.program.contexts[2].prefix,:_owned)\nconst PROJECTION=SlotStatic(Tuple(i for (i,pair) in enumerate(PROGRAM.ordered)\n    if first(first(pair))===PREFIX))\nBase.invokelatest(compare_rngs,PROGRAM,PROJECTION,PROTOTYPE.comparator)\n"
