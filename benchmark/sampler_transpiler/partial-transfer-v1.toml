"benchmark_contract" = "Centered Eight Schools, ten Float64 parameters, unit diagonal metric, stepsize0.03. Retains selected position and reusable position caches; momentum is refreshed next transition and is NOT the selected joint phasepoint. Fixed integration work, no adaptation/history/ESS. AdvancedHMC uses the same density/gradient/metric/steps and additionally materializes trajectories and computes acceptance statistics. Resets outside timing; Reactant sync=true,donated_args=:none; no host call per gradient. Counters enabled. No cross-backend numerical or trajectory agreement requirement."
"transformation" = "Consecutive matching authoritative-field copies establish equality for copied inputs and identical shared authorities. Close over the selected recipe DAG, then transfer affected derived caches whose inputs are all equal. Copy currentness, preserving destination numeric buffers. A cache depending on an uncopied owned input is not reusable. Borrowed destination arrays disable the optimization; hidden copies admit only builtin numeric scalar/Array storage. Full endpoint coalescing unchanged; partial_transfers=false disables this new part only."

