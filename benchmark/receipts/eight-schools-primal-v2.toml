rounds = 10
samples_per_round = 200
seconds_per_round = 0.2
setup_in_timed_region = false
turing_pointwise_api = "DynamicPPL.pointwise_loglikelihoods"
turing_transform_strategy = "fixed transforms"
unsupported_cells_recorded = true
