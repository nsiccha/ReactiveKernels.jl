generated_predictions_included = false
gradients_included = false
input_boundaries = ["packed_unconstrained", "constrained_parameters", "minimal_likelihood"]
matrix_layout = "long-form provider/model/configuration/boundary/outcome rows"
model = "centered Eight Schools"
models = ["centered"]
outcomes = ["joint", "prior", "likelihood", "pointwise"]
parity_atol = 1.0e-12
parity_rtol = 1.0e-11
preparation_in_timed_region = false
rk_configurations = ["primal_native", "primal_native_bound", "primal_nonallocating", "primal_nonallocating_bound"]
