[pins]
distributions_version = "0.25.131"
julia_version = "1.10.11"
probability_measures_sha = "7cf3a6e112aaae2097b8d401b256d1bce635e03e"
probability_measures_version = "0.1.0"
reactant_jll_version = "0.0.407+0"
reactant_version = "0.2.284"
reactivekernels_dirty = false
reactivekernels_sha = "9596abb1e0cc933e0d19ab5e7949980b827bd6d8"

[protocol]
estimator = "median of per-round BenchmarkTools minimum times"
families = ["cauchy_location_scale", "laplace_location_scale", "bernoulli_logit", "lognormal_logscale", "exponential_logscale", "geometric_logit", "uniform_bounded", "poisson_lograte", "gamma_shape_rate", "beta_shapes", "binomial_logit"]
reactant_compile_time_in_timed_region = false
reactant_parameters_traced = true
reactant_sync = true
reactant_transfers_included = false
rounds = 5
samples_per_round = 200
seconds_per_round = 0.25
sizes = [1000, 100000]

    [protocol.element_types]
    continuous_observations = "Float64"
    discrete_observations = "Int"
    parameters = "Float64"

    [protocol.formulas]
    bernoulli_logit = "Bernoulli from logit probability"
    beta_shapes = "Beta from two positive shapes on the unit interval"
    binomial_logit = "Binomial counts from fixed trials and logit p"
    cauchy_location_scale = "Cauchy with location and scale"
    exponential_logscale = "Exponential from log scale"
    gamma_shape_rate = "Gamma from shape and log rate"
    geometric_logit = "Geometric failures before success from logit p"
    laplace_location_scale = "Laplace with location and scale"
    lognormal_logscale = "LogNormal from location and log scale"
    poisson_lograte = "Poisson counts from the log rate"
    uniform_bounded = "Uniform with dynamic lower and upper endpoints"

