name: Docs
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write
  actions: write        # let julia-actions/cache evict its own caches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main/tag deploys atomic, but retain only the newest pending run per ref.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          # RuntimeGeneratedFunctions 0.5 currently fails under Julia 1.12's
          # stricter world-age semantics; match the package's tested baseline.
          version: '1.10'
      # Restore the depot/compiled-artifact cache BEFORE any Julia runs so every
      # step below reuses cached precompiles instead of recompiling on a cold depot.
      - uses: julia-actions/cache@v2
      - name: Install pinned documentation dependencies
        run: julia --project=docs docs/instantiate.jl
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: julia --project=docs docs/make.jl
