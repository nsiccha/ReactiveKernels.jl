name: Docs
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main/tag deploys atomic, but retain only the newest pending run per ref.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RK_RENDERED_DOCS_REPORT: rendered-docs-advisories.json
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          # RuntimeGeneratedFunctions 0.5 currently fails under Julia 1.12's
          # stricter world-age semantics; match the package's tested baseline.
          version: '1.10'
      - name: Initialize rendered-docs advisory report
        run: julia --startup-file=no -e 'include("docs/check_rendered.jl"); initialize_rendered_docs_report()'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          DEPS="$RUNNER_TEMP/rk-docs-deps"
          mkdir -p "$DEPS"
          git clone -b dev https://github.com/nsiccha/AlgebraOfVega.jl.git "$DEPS/AlgebraOfVega.jl"
          git clone -b kb-impl/DynamicObjects-sbpmx-reflect https://github.com/nsiccha/DynamicObjects.jl.git "$DEPS/DynamicObjects.jl"
          git clone -b dev https://github.com/nsiccha/HTMX.jl.git "$DEPS/HTMX.jl"
          git clone -b devibe https://github.com/nsiccha/HTMXObjects.jl.git "$DEPS/HTMXObjects.jl"
          git clone https://github.com/nsiccha/Treebars.jl.git "$DEPS/Treebars.jl"
          julia --project=docs -e '
            using Pkg
            deps = ENV["RUNNER_TEMP"] * "/rk-docs-deps"
            Pkg.develop([
              PackageSpec(path=pwd()),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsDistributionKernels")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsKernelExamples")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsBatchingExamples")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsPPLExamples")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsCompatibilityExamples")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsNUTSExamples")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsStreamingStats")),
              PackageSpec(path=joinpath(pwd(), "packages", "ReactiveKernelsHMCDiagnostics")),
              PackageSpec(path=joinpath(deps, "AlgebraOfVega.jl")),
              PackageSpec(path=joinpath(deps, "DynamicObjects.jl")),
              PackageSpec(path=joinpath(deps, "HTMX.jl")),
              PackageSpec(path=joinpath(deps, "HTMXObjects.jl")),
              PackageSpec(path=joinpath(deps, "Treebars.jl")),
            ])
            Pkg.instantiate()
          '
      - name: Test rendered-docs contract
        run: julia --startup-file=no docs/test_rendered_contracts.jl
      - name: Test focused benchmark renderers
        run: julia --startup-file=no --project=docs docs/test_benchmark_views.jl
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
      - name: Upload rendered-docs advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-docs-advisories
          path: rendered-docs-advisories.json
          if-no-files-found: error
          retention-days: 14
