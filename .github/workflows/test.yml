name: Run tests
on:
  push:
    branches: [main, dev]
  pull_request:
    # `synchronize` fires on new commits pushed to a PR (unlike `edited`, which
    # only fires on title/body edits), so a pushed fix re-runs the suite.
    types: [opened, synchronize, reopened]
permissions:
  actions: write       # let julia-actions/cache evict its own caches
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
        with:
          # Compiled caches are sensitive to Julia's coverage/bounds flags and
          # RuntimeGeneratedFunctions' generated method worlds. Rebuild them
          # for each job while retaining package, artifact, and registry caches.
          cache-compiled: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage instrumentation is exercised on LTS. On Julia 1.12/pre it
          # adds counter allocations to the zero-allocation probe, so use those
          # lanes for the ordinary compiled, zero-allocation contract instead.
          coverage: ${{ matrix.julia-version == 'lts' }}
          check_bounds: yes
          compiled_modules: yes

  nonallocating-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Test optional MutatingFunctions extension
        run: julia --startup-file=no test/run_nonallocating_integration.jl
