name: Run tests
on:
  push:
    branches: [main, dev]
  pull_request:
    # `synchronize` fires on new commits pushed to a PR (unlike `edited`, which
    # only fires on title/body edits), so a pushed fix re-runs the suite.
    types: [opened, synchronize, reopened]
permissions:
  actions: write       # let julia-actions/cache evict its own caches
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Branch runs finish; only PR runs give way to a newer push. Cancelling on
  # main stopped every run before the ~100-minute example-packages job ended.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: test (${{ matrix.julia-version }}, ${{ matrix.julia-arch }}, ${{ matrix.os }}, ${{ matrix.test-shard }})
    runs-on: ${{ matrix.os }}
    # Core compatibility tops out near 65 minutes on the slowest current
    # Windows lane. Keep a bounded margin without letting a silent test consume
    # a hosted runner for three hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core owns supported Julia/OS compatibility.
          - { julia-version: 'lts', julia-arch: x64, os: ubuntu-latest, test-shard: core }
          - { julia-version: 'lts', julia-arch: x64, os: windows-latest, test-shard: core }
          - { julia-version: 'lts', julia-arch: x64, os: macOS-latest, test-shard: core }
          - { julia-version: '1', julia-arch: x64, os: ubuntu-latest, test-shard: core }
          - { julia-version: '1', julia-arch: x64, os: windows-latest, test-shard: core }
          - { julia-version: '1', julia-arch: x64, os: macOS-latest, test-shard: core }
          - { julia-version: 'pre', julia-arch: x64, os: ubuntu-latest, test-shard: core }
          - { julia-version: 'pre', julia-arch: x64, os: windows-latest, test-shard: core }
          - { julia-version: 'pre', julia-arch: x64, os: macOS-latest, test-shard: core }

          # Acceptance asserts platform-independent semantics once. Repeating
          # these compiler/runtime/sampler/benchmark suites on every supported
          # Julia/OS cell spent 36 runners proving the same contract.
          - { julia-version: 'lts', julia-arch: x64, os: ubuntu-latest, test-shard: acceptance-compiler }
          - { julia-version: 'lts', julia-arch: x64, os: ubuntu-latest, test-shard: acceptance-runtime }
          - { julia-version: 'lts', julia-arch: x64, os: ubuntu-latest, test-shard: acceptance-samplers }
          - { julia-version: 'lts', julia-arch: x64, os: ubuntu-latest, test-shard: acceptance-benchmarks }
    steps:
      - uses: actions/checkout@v4
        if: matrix.test-shard != 'acceptance-samplers'
      # Benchmark source-attestation tests compare current source with exact
      # historical receipt pins.  Give only that shard the required history;
      # the other twelve matrix cells retain the ordinary shallow checkout.
      - uses: actions/checkout@v4
        if: matrix.test-shard == 'acceptance-samplers'
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage instrumentation is exercised on LTS. On Julia 1.12/pre it
          # adds counter allocations to the zero-allocation probe, so use those
          # lanes for the ordinary non-coverage, zero-allocation contract instead.
          coverage: ${{ matrix.julia-version == 'lts' }}
          check_bounds: yes
          # Every package acceptance lane exercises Julia's ordinary compiled
          # module path. Compatibility failures must remain visible rather than
          # being converted into a cacheless full-suite run.
          compiled_modules: "yes"
          test_args: ${{ matrix.test-shard }}

  compiled-module-smoke:
    name: compiled-module precompile/load (${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1', 'pre']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      # Deliberately omit julia-actions/cache: this small job proves that a
      # fresh compiled-module depot can precompile and load the package. If an
      # upstream precompile regression returns, it fails here directly without
      # changing the full suite's execution model.
      - name: Precompile and load ReactiveKernels
        run: julia --startup-file=no --compiled-modules=yes --project=@stdlib -e 'using Pkg; Pkg.activate(pwd()); Pkg.instantiate(); Pkg.precompile(; strict=true); using ReactiveKernels'

  nonallocating-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Test optional MutatingFunctions extension
        run: julia --startup-file=no test/run_nonallocating_integration.jl

  example-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Resolve nested example packages
        run: julia --startup-file=no --project=packages packages/setup.jl
      - name: Test nested example packages
        run: julia --startup-file=no --project=packages packages/test.jl --exclude=ReactiveKernelsPPL

  rkppl:
    name: rkppl (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # One job cannot finish the ReactiveKernelsPPL suite inside GitHub's
    # 360-minute job limit: run 37575292025 spent 141 minutes on its first 51
    # of 228 test files. The shards split the files into N groups of about
    # equal measured minutes (packages/ReactiveKernelsPPL/test/sharding.jl,
    # shard_minutes.toml); N is the matrix length.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
        with:
          # The shards share one environment; one cache entry serves them all.
          include-matrix: false
      - name: Resolve nested example packages
        run: julia --startup-file=no --project=packages packages/setup.jl
      - name: Test ReactiveKernelsPPL shard
        env:
          RKPPL_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: julia --startup-file=no --project=packages packages/test.jl ReactiveKernelsPPL

  reactant-integration:
    runs-on: ubuntu-latest
    # The complete optional compiler suite is about 44 minutes on the pinned
    # local acceptance host and can cross 60 minutes under hosted contention.
    # Keep a bounded margin so a healthy suite is not reported as cancelled.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Test optional Reactant compiler extension
        run: julia --startup-file=no test/run_reactant_integration.jl
